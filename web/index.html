<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Applique le theme avant le rendu (evite le clignotement clair->sombre).
      try {
        var t = localStorage.getItem('theme')
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark')
        }
      } catch (e) {}
    </script>
    <title>Wandrail — Le tourisme en train, autrement</title>
    <meta
      name="description"
      content="Découvrez la France en train avec Wandrail : destinations moins connues, recommandations personnalisées, itinéraires et impact carbone expliqué."
    />
    <meta name="theme-color" content="#0A5C36" />
    <meta name="author" content="Thilissa Amara" />

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Wandrail" />
    <meta property="og:title" content="Wandrail — Le tourisme en train, autrement" />
    <meta
      property="og:description"
      content="Plateforme Big Data & IA de recommandation de destinations françaises accessibles en train. Projet M1 BDIA."
    />
    <meta property="og:url" content="https://wandrail-web.onrender.com" />
    <meta property="og:locale" content="fr_FR" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Wandrail — Le tourisme en train, autrement" />

      name="twitter:description"

    />
